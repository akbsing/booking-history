services:
  mongodb:
    image: mongo:8.0.14
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  booking-history:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/booking_history
      SERVER_PORT: 8080
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb-data:
